name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Pinned so the server under test signs cookies with a known key.
  AUTH_SECRET: ci-only-secret-not-used-in-any-real-deployment

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Lockfile must match package.json exactly — `npm ci` fails loudly if not.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Copies the MediaPipe WASM runtime out of node_modules and tries to fetch
      # the three .task bundles. Optional: the engine falls back to the CDN at
      # runtime, so a network hiccup must not fail the build.
      - name: Prepare MediaPipe assets
        continue-on-error: true
        run: node scripts/setup-assets.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests
          path: docs/logs/test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: npm run build

  smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare MediaPipe assets
        continue-on-error: true
        run: node scripts/setup-assets.mjs

      - name: Build
        run: npm run build

      # Boot the production server, wait for /api/health, then drive the whole
      # product: security headers, the auth gate, signup, saving a session, the
      # generated report, cross-account isolation, logout, PWA/SEO routes.
      - name: Start server and run smoke suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/logs

          npx next start -p 3111 > docs/logs/start-run.log 2>&1 &
          SERVER_PID=$!

          ready=""
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3111/api/health > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ -z "$ready" ]; then
            echo "::error::Server did not become ready"
            cat docs/logs/start-run.log
            kill "$SERVER_PID" || true
            exit 1
          fi

          set +e
          node scripts/smoke.mjs http://localhost:3111
          SMOKE_EXIT=$?
          set -e

          kill "$SERVER_PID" || true
          cat docs/logs/smoke.txt
          exit "$SMOKE_EXIT"

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: |
            docs/logs/smoke.txt
            docs/logs/start-run.log
          if-no-files-found: ignore
          retention-days: 7
